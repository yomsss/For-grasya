<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./css.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #b383a7;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Everything stays together */
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 90%;
      max-width: 1400px;
    }

    /* Images */
    .gif {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 5px;
    }

    /* Center text and buttons */
    .middle {
      text-align: center;
      max-width: 600px;
    }

    .middle h1 {
      font-size: 32px;
      line-height: 1.3;
      color: black;
      margin: 0;
    }

    /* Buttons */
    .btn {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 40px;
    }

    .btn a {
      background-color: white;
      color: black;
      text-decoration: none;

      padding: 12px 30px;
      border-radius: 25px;

      font-size: 18px;
      transition: 0.2s;
    }

    .btn a:hover {
      background-color: #eee;
      transform: scale(1.05);
    }

    /* Make it work on phones */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        gap: 25px;
      }

      .gif {
        width: 250px;
        height: 200px;
      }

      .middle h1 {
        font-size: 24px;
      }

      .btn {
        margin-top: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Left image -->
    <img
      src="C:\Users\portu\Downloads\html's\gif's\gif4.gif"
      class="gif"
      alt="gif"	
    >

    <!-- Middle content -->
    <div class="middle">

      <h1>
        Well, if you're unsure then<br>
        would you want to talk abt it?
      </h1>

      <div class="btn">
        <a href="hm.html">Yes</a>
        <a href="no1.html">No</a>
      </div>

    </div>

    <!-- Right image -->
    <img
      src="C:\Users\portu\Downloads\html's\gif's\gif6.gif"
      class="gif"
      alt="gif"
    >

  </div>

</body>

</html>
