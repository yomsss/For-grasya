
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bossing mahal talaga kita sensya na</title>

  <link rel="stylesheet" href="./css.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 30px 16px;
      background: #b383a7;
      font-family: Arial, Helvetica, sans-serif;
      color: #281b26;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .photo-collage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .extra-img {
      position: absolute;
      display: block;
      width: clamp(110px, 20vw, 230px);
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
    }

    .img1 {
      top: 5%;
      left: 5%;
      transform: rotate(-12deg);
    }

    .img2 {
      top: 7%;
      right: 5%;
      transform: rotate(10deg);
    }

    .img3 {
      bottom: 5%;
      left: 5%;
      transform: rotate(9deg);
    }

    .img4 {
      bottom: 6%;
      right: 5%;
      transform: rotate(-9deg);
    }

    .img5 {
      top: 40%;
      left: 1%;
      width: clamp(90px, 15vw, 160px);
      transform: rotate(-6deg);
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: clamp(20px, 4vw, 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      background: rgba(255, 240, 249, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(55, 25, 48, 0.18);
    }

    .main-gif {
      display: block;
      width: 100%;
      max-width: 300px;
      max-height: 35svh;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
    }

    h1 {
      width: 100%;
      margin: 0;
      font-size: clamp(23px, 5vw, 34px);
      line-height: 1.25;
      overflow-wrap: break-word;
    }

    p {
      width: 100%;
      max-width: 500px;
      margin: 0;
      font-size: clamp(15px, 2.5vw, 18px);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .btn {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 4px;
    }

    .btn a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 120px;
      min-height: 48px;
      padding: 12px 30px;
      background: #fff;
      color: #633e59;
      border: 1px solid #e7c9dd;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .btn a:hover {
      background: #f8e6f2;
      transform: translateY(-2px);
    }

    .btn a:focus-visible {
      outline: 3px solid #633e59;
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      body {
        display: block;
        padding: 16px 14px 28px;
      }

      .photo-collage {
        position: relative;
        inset: auto;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
        max-width: 440px;
        margin: 0 auto 20px;
      }

      .extra-img,
      .img1,
      .img2,
      .img3,
      .img4,
      .img5 {
        position: static;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 12px;
        transform: none;
      }

      .container {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        padding: 22px 18px;
        gap: 16px;
        border-radius: 20px;
      }

      .main-gif {
        width: 100%;
        max-width: 260px;
        max-height: 32svh;
      }

      h1 {
        font-size: clamp(24px, 7vw, 30px);
      }

      p {
        font-size: 16px;
        line-height: 1.8;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 12px 10px 22px;
      }

      .photo-collage {
        gap: 7px;
      }

      .container {
        padding: 20px 14px;
      }

      p {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .btn a {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="photo-collage">
    <img class="extra-img img1" src="ganda4.jpg" alt="Favorite photo 1" />
    <img class="extra-img img2" src="ganda5.jpg" alt="Favorite photo 2" />
    <img class="extra-img img3" src="us4.jpg" alt="Photo of us 1" />
    <img class="extra-img img4" src="us 1.jpg" alt="Photo of us 2" />
    <img class="extra-img img5" src="ganda2.jpg" alt="Favorite photo 3" />
  </div>

  <main class="container">
    <img
      class="main-gif"
      src="gif7.gif"
      alt="Our special GIF"
    />

    <h1>Well ayoko ng pahabain</h1>

    <p>
      Thank you for the nonstop love you gave me. Thanks kasi
      akala ko wala talaga akong chance non eh hahaha.
      It's great to love you, pero wala...
      Yeah, I hope napatunayan ko na mahirap hindi sukuan
      at palitan. Mahirap kang sukuang ipaglaban.
      At mahal na mahal kita.
    </p>

    <div class="btn">
      <a href="oh.html">oh..</a>
    </div>
  </main>
</body>
</html>
