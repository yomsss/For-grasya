<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bossing mahal talaga kita sensya na </title>

  <link rel="stylesheet" href="./css.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #b383a7;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 12px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      position: relative;
      z-index: 10;
    }

    .container img.main-gif {
      width: min(300px, 70vw);
      max-height: 55dvh;
      height: auto;
      display: block;
      object-fit: contain;
      transform: rotate(0deg);
      margin: 80px 0;
    }

    h1 {
      margin: -75px 0 0;
      font-size: clamp(23px, 4vw, 32px);
      text-align: center;
      overflow-wrap: anywhere;
    }

    p {
      margin: 4px 0 0;
      font-size: clamp(16px, 2.5vw, 18px);
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .btn {
      margin-top: 45px;
      display: flex;
      justify-content: center;
    }

    .btn a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: white;
      color: black;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 18px;
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn a:hover {
      background-color: #eeeeee;
      transform: translateY(-2px);
    }

    .extra-img {
      position: absolute;
      display: block;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 15px;
      z-index: 1;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .img1 {
      width: clamp(110px, 14vw, 180px);
      top: 2%;
      left: 15%;
      transform: rotate(-14deg);
    }

    .img2 {
      width: clamp(160px, 21vw, 280px);
      top: 4%;
      right: 8%;
      transform: rotate(11deg);
    }

    .img3 {
      width: clamp(140px, 17vw, 230px);
      bottom: 3%;
      left: 5%;
      transform: rotate(17deg);
    }

    .img4 {
      width: clamp(180px, 23vw, 320px);
      bottom: 8%;
      right: 5%;
      transform: rotate(-12deg);
    }

    .img5 {
      width: clamp(90px, 12vw, 150px);
      top: 43%;
      left: 8%;
      transform: rotate(-7deg);
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
        align-items: center;
      }

      .container {
        max-width: 100%;
        padding: 8px;
      }

      .container img.main-gif {
        width: min(260px, 62vw);
        max-height: 34dvh;
        margin: 65px 0;
      }

      h1 {
        margin-top: -60px;
        font-size: clamp(21px, 6vw, 29px);
        max-width: 100%;
      }

      p {
        font-size: clamp(14px, 4vw, 17px);
      }

      .btn {
        margin-top: 28px;
      }

      .btn a {
        padding: 11px 27px;
      }

      .img1 {
        width: 25vw;
        top: 7%;
        left: 3%;
        transform: rotate(-14deg);
      }

      .img2 {
        width: 34vw;
        top: 9%;
        right: 2%;
        transform: rotate(11deg);
      }

      .img3 {
        width: 28vw;
        bottom: 5%;
        left: 2%;
        transform: rotate(13deg);
      }

      .img4 {
        width: 36vw;
        bottom: 6%;
        right: 1%;
        transform: rotate(-10deg);
      }

      .img5 {
        width: 20vw;
        top: 43%;
        left: 1%;
        transform: rotate(-7deg);
      }
    }

    /* Extra-small phones */
    @media (max-width: 380px) {
      .container img.main-gif {
        width: 58vw;
        margin: 55px 0;
      }

      h1 {
        margin-top: -50px;
        font-size: 22px;
      }

      .img1 {
        width: 23vw;
        top: 8%;
        left: 2%;
      }

      .img2 {
        width: 31vw;
        top: 10%;
        right: 1%;
      }

      .img3 {
        width: 26vw;
        bottom: 4%;
        left: 1%;
      }

      .img4 {
        width: 33vw;
        bottom: 5%;
        right: 1%;
      }

      .img5 {
        width: 19vw;
        top: 43%;
        left: 0;
      }
    }
  </style>
</head>

<body>

  <img class="extra-img img1" src="kulitan2.jpg" alt="Image 1">
  <img class="extra-img img2" src="wholesome1.jpg" alt="Image 2">
  <img class="extra-img img3" src="kulitan3.jpg" alt="Image 3">
  <img class="extra-img img4" src="kulitan1.jpg" alt="Image 4">
  <img class="extra-img img5" src="wholesome2.jpg" alt="Image 5">

  <div class="container">

    <img class="main-gif"
      src="gif6.gif"
      alt="GIF">

    <h1>Part of my life na kasamaa kita.</h1>

    <p>mahal na mahal kita.</p>

    <div class="btn">
      <a href="new 1.html">...</a>
    </div>

  </div>

</body>

</html>
