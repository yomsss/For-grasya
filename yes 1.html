<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ouch me grasya worldwide :(</title>

  <link rel="stylesheet" href="./css.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;

      background-color: #b383a7;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .container img {
      display: block;

      /* Responsive image sizing */
      width: 100%;
      max-width: 300px;
      max-height: 45vh;
      max-height: 45dvh;

      height: auto;
      object-fit: contain;
      flex-shrink: 1;
    }

    h1 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(22px, 5vw, 32px);
      overflow-wrap: break-word;
    }

    p {
      margin: 0;
      font-size: clamp(16px, 4vw, 18px);
    }

    .btn {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }

    .btn a {
      display: inline-block;
      background-color: white;
      color: black;
      text-decoration: none;

      padding: 12px 30px;
      border-radius: 25px;
      font-size: 18px;
    }

    .btn a:hover {
      background-color: #eeeeee;
    }

    /* Adjust for shorter mobile screens */
    @media (max-height: 600px) {
      body {
        align-items: flex-start;
      }

      .container img {
        max-height: 35vh;
        max-height: 35dvh;
      }

      .btn {
        margin-top: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="gif5.gif" alt="GIF">

    <h1>Well, I guess hanggang dito nalang talaga huh?..</h1>

    <p>arouch?😭</p>

    <div class="btn">
      <a href="yea.html">I guess...</a>
    </div>

  </div>

</body>

</html>
