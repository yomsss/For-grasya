
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ouch me grasya worldwide :(</title>

  <link rel="stylesheet" href="./css.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;

      background-color: #b383a7;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .container img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 45dvh;

      object-fit: contain;
      flex-shrink: 1;
    }

    h1 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(22px, 5vw, 32px);
      overflow-wrap: anywhere;
    }

    p {
      margin: 0;
      font-size: clamp(16px, 4vw, 18px);
    }

    .btn {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .btn a {
      display: inline-block;
      background-color: white;
      color: black;
      text-decoration: none;

      padding: 12px 30px;
      border-radius: 25px;
      font-size: 18px;
    }

    .btn a:hover {
      background-color: #eeeeee;
    }
    
     .top-left-gif {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 400px;
      max-width: calc(100vw - 40px);
      height: auto;
      max-height: 35dvh;
      object-fit: contain;
      object-position: top left;
    }
    
    .bottom-right-gif {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 450px;
      max-width: calc(100vw - 40px);
      height: auto;
      max-height: 35dvh;
      object-fit: contain;
      object-position: bottom right;
    }
    
    .middle {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      text-align: center;
    }
    
    @media screen and (max-width: 768px) {
      .top-left-gif {
        top: 20px;
        left: 20px;
        width: 32vw;
        max-width: 150px;
        max-height: 20dvh;
      }
    
      .bottom-right-gif {
        bottom: 20px;
        right: 20px;
        width: 32vw;
        max-width: 150px;
        max-height: 20dvh;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="gif5.gif" alt="GIF" />

    <h1>Well, I guess hanggang dito nalang talaga huh?..</h1>

    <p>arouch?😭</p>

    <div class="btn">
      <a href="yea.html">I guess...</a>
    </div>

  </div>
</body>

</html>
