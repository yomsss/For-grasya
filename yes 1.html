<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ouch me grasya worldwide :(</title>

  <link rel="stylesheet" href="./css.css" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 600px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .container img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 45dvh;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      max-width: 100%;
      font-size: clamp(22px, 5vw, 32px);
      overflow-wrap: anywhere;
    }

    p {
      margin: 0;
      font-size: clamp(16px, 4vw, 18px);
    }

    .btn {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .btn a {
      display: inline-block;
      background-color: white;
      color: #111;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 18px;
      transition: transform 0.3s ease,
                  background-color 0.3s ease;
    }

    .btn a:hover {
      background-color: #f3d9e8;
      transform: translateY(-3px);
    }

    @media screen and (max-width: 768px) {
      body {
        padding: 16px 12px;
      }

      .container {
        gap: 12px;
      }

      .container img {
        max-height: 35dvh;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="./gif5.gif" alt="Sad GIF" />

    <h1>Well, I guess hanggang dito nalang talaga huh?..</h1>

    <p>arouch?😭</p>

    <div class="btn">
      <a href="./yea.html">I guess...</a>
    </div>

  </div>

</body>
</html>
